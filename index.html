<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elena Vance Archive</title>
  <meta name="description" content="Foundation-style archive for Elena Vance's lore, with personal logs.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">Elena Vance <span>Archive</span></a>
    <nav class="site-nav">
      <a href="#/lore">Documents</a>
      <a href="#/timeline">Chronology</a>
      <a href="#/journal">Personal Logs</a>
    </nav>
    <div class="header-tools">
      <label class="clearance">Clearance
        <select id="clearance" aria-label="Your clearance level">
          <option value="1">Level 1</option>
          <option value="2">Level 2</option>
          <option value="3">Level 3</option>
          <option value="4">Level 4</option>
          <option value="5">Level 5</option>
        </select>
      </label>
      <input id="search" class="search" type="search" placeholder="Search…" aria-label="Search archive and logs" autocomplete="off">
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <footer class="site-footer">
    Personal logs are saved in this browser only. Use Copy JSON on the Personal Logs page to keep a backup.
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
